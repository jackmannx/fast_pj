[project]
name = "fast-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Htoo Tay Za", email = "htootayza32@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.143.0",
    "fastapi-users[standard]>=15.0.5",
    "imagekitio>=5.10.0",
    "pydantic>=2.14.1",
